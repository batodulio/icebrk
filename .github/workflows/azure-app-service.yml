name: Build and deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # lets the runner request an OIDC token for azure/login
  contents: read

concurrency:
  # A newer push supersedes an in-flight deploy rather than racing it.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Prints whether each secret resolved to something, and the exact subject
      # GitHub will assert to Entra. Values are never printed — only true/false —
      # so this is safe to leave in place.
      - name: Preflight — check Azure inputs
        run: |
          echo "AZURE_CLIENT_ID set ......... ${{ secrets.AZURE_CLIENT_ID != '' }}"
          echo "AZURE_TENANT_ID set ......... ${{ secrets.AZURE_TENANT_ID != '' }}"
          echo "AZURE_SUBSCRIPTION_ID set ... ${{ secrets.AZURE_SUBSCRIPTION_ID != '' }}"
          echo ""
          echo "Subject GitHub will send to Entra:"
          echo "  repo:${{ github.repository }}:ref:${{ github.ref }}"
          echo ""
          echo "The federated credential's Subject identifier must match that line exactly."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins, so CI can never
      # silently pick up a different version than the one you tested against.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build front end
        run: npm run build

      # App Service copies these files as-is, so node_modules ships with the
      # deploy. Dropping dev dependencies first cuts the upload from hundreds of
      # megabytes to a fraction of that, and keeps build tooling off the server.
      - name: Strip dev dependencies
        run: npm prune --omit=dev

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: icebrk-app
          package: .
